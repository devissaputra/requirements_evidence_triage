<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="100%" height="100%" fill="white"/><text x="45" y="50" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Method</text><text x="45" y="82" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">The operational queue never uses gold labels for ranking.</text><circle cx="75" cy="150" r="23" fill="#f0f0f0" stroke="#333"/><text x="75" y="156" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><rect x="120" y="120" width="1020" height="62" rx="10" fill="#fafafa" stroke="#444"/><text x="145" y="158" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Join gold and automatic rows by ID.</text><circle cx="75" cy="240" r="23" fill="#f0f0f0" stroke="#333"/><text x="75" y="246" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><rect x="120" y="210" width="1020" height="62" rx="10" fill="#fafafa" stroke="#444"/><text x="145" y="248" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Compute confusion matrices for five comparable labels.</text><circle cx="75" cy="330" r="23" fill="#f0f0f0" stroke="#333"/><text x="75" y="336" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><rect x="120" y="300" width="1020" height="62" rx="10" fill="#fafafa" stroke="#444"/><text x="145" y="338" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Use gold-error ranking only as an oracle upper bound.</text><circle cx="75" cy="420" r="23" fill="#f0f0f0" stroke="#333"/><text x="75" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><rect x="120" y="390" width="1020" height="62" rx="10" fill="#fafafa" stroke="#444"/><text x="145" y="428" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Rank deployably by prediction-pattern rarity; compare with random expectation.</text></svg>