<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="100%" height="100%" fill="#ffffff"/><text x="55" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Leakage safe evidence triage pipeline</text><text x="55" y="82" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#475569">Gold labels are allowed for evaluation and oracle diagnosis, but never for deployable queue construction.</text><rect x="55" y="125" width="245" height="125" rx="15" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="73" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#92400e">Gold reference labels</text><text x="73" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">571 eTour items</text><text x="73" y="203" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Evaluation reference only</text><rect x="55" y="285" width="245" height="125" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="73" y="316" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">Automatic predictions</text><text x="73" y="342" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Five labels per item</text><text x="73" y="363" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Available before review</text><rect x="355" y="205" width="245" height="145" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="373" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#6d28d9">Classification evaluation</text><text x="373" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Join by requirement ID</text><text x="373" y="283" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">TP • FP • FN • TN</text><text x="373" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Precision • Recall • F1</text><line x1="300" y1="185" x2="343" y2="245" stroke="#d97706" stroke-width="2"/><polygon points="343,239 355,245 343,251" fill="#d97706"/><line x1="300" y1="345" x2="343" y2="310" stroke="#2563eb" stroke-width="2"/><polygon points="343,304 355,310 343,316" fill="#2563eb"/><line x1="650" y1="105" x2="650" y2="610" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 7"/><text x="650" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b91c1c">INFORMATION BOUNDARY</text><rect x="620" y="420" width="60" height="110" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="650" y="445" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#991b1b">Gold</text><text x="650" y="464" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#991b1b">blocked</text><text x="650" y="483" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#991b1b">from</text><text x="650" y="502" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#991b1b">deployable</text><text x="650" y="521" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#991b1b">ranking</text><rect x="720" y="130" width="420" height="140" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="738" y="161" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#9a3412">Oracle diagnostic</text><text x="738" y="187" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Rank by observed gold versus prediction errors</text><text x="738" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Uses answer key • not deployable</text><text x="738" y="229" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Quantifies concentration ceiling</text><line x1="600" y1="245" x2="708" y2="200" stroke="#f97316" stroke-width="2"/><polygon points="708,194 720,200 708,206" fill="#f97316"/><rect x="720" y="325" width="420" height="165" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="738" y="356" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">Prediction only queue</text><text x="738" y="382" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Rare prediction patterns first</text><text x="738" y="403" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Then hierarchy inconsistency</text><text x="738" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Then predicted label density • then ID</text><line x1="300" y1="345" x2="708" y2="405" stroke="#2563eb" stroke-width="2"/><polygon points="708,399 720,405 708,411" fill="#2563eb"/><rect x="720" y="545" width="420" height="105" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="738" y="576" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#475569">Uniform random reference</text><text x="738" y="602" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Expected capture share = review budget / 571</text><text x="738" y="623" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">No gold labels used for ranking</text><rect x="180" y="500" width="360" height="135" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="198" y="531" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#4338ca">Compare at fixed budgets</text><text x="198" y="557" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">10 • 25 • 50 • 100 items</text><text x="198" y="578" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Errors captured • capture share</text><text x="198" y="599" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Enrichment versus random expectation</text><line x1="930" y1="270" x2="528" y2="550" stroke="#f97316" stroke-width="2"/><polygon points="528,544 540,550 528,556" fill="#f97316"/><line x1="930" y1="490" x2="528" y2="585" stroke="#22c55e" stroke-width="2"/><polygon points="528,579 540,585 528,591" fill="#22c55e"/><line x1="720" y1="595" x2="528" y2="610" stroke="#64748b" stroke-width="2"/><polygon points="528,604 540,610 528,616" fill="#64748b"/><text x="55" y="725" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#334155">Scientific safeguard: the 51.9% top 100 result is an oracle upper bound; the deployable top 100 result is 21.5%.</text></svg>