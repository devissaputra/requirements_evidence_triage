<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="100%" height="100%" fill="#ffffff"/><text x="55" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Evidence boundary and released findings</text><rect x="55" y="100" width="1090" height="95" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="73" y="131" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">Classification evidence</text><text x="73" y="157" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">F1 spans 0.653 to 0.945; UserRelated recall is 0.502 and drives the clearest label specific weakness.</text><rect x="55" y="220" width="1090" height="95" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="73" y="251" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#9a3412">Oracle diagnostic</text><text x="73" y="277" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Gold aware top 100 review captures 277 of 534 label errors, or 51.9%. This is a non deployable ceiling.</text><rect x="55" y="340" width="1090" height="95" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="73" y="371" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">Deployable result</text><text x="73" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Prediction only rarity captures 115 of 534 errors in 100 items, or 21.5%, versus 17.5% expected at random.</text><rect x="55" y="460" width="1090" height="95" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="73" y="491" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#991b1b">Claim boundary</text><text x="73" y="517" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Single benchmark • exploratory post hoc heuristic • no optimality, calibrated uncertainty, cost saving, or external validation claim.</text></svg>