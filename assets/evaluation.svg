<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="100%" height="100%" fill="white"/><text x="45" y="50" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Evidence Boundary</text><rect x="55" y="90" width="1090" height="72" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="118" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Classification finding</text><text x="80" y="143" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">F1 spans 0.653–0.945 across five evaluated labels; 534 label errors are observed.</text><rect x="55" y="185" width="1090" height="72" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="213" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Oracle ceiling</text><text x="80" y="238" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Gold-aware top-100 ranking captures 51.9% of errors. It cannot be deployed before review.</text><rect x="55" y="280" width="1090" height="72" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="308" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Deployable finding</text><text x="80" y="333" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Prediction-only rarity captures 21.5% in 100 items vs 17.5% random expectation (1.23×).</text><rect x="55" y="375" width="1090" height="72" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="403" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Boundary</text><text x="80" y="428" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Exploratory, post-hoc, single-benchmark routing result; no external-validation or optimality claim.</text></svg>