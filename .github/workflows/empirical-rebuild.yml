name: Empirical source rebuild
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/empirical-rebuild.yml"
      - "research/**"
      - "scripts/fetch_and_analyze.py"
      - "data/derived/**"
      - "data/source_manifest.json"
      - "results/**"
permissions:
  contents: read
jobs:
  rebuild-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/fetch_and_analyze.py --check
